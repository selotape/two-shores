<meta charset="utf-8">

<style>
/* names may be in any script: a Hebrew or Arabic name reads right to left in its own box */
.lab,h3,.t,.k,.v,#open,#compass,#next,.dl-top b,.pie li span,.ev{unicode-bidi:plaintext}
/* Layout: one screen. A slim bar on top, then the map fills the box; text pages open over the whole map. Single dark look by choice: it is a night-sea game screen. */
:root{
  color-scheme:dark;
  --ink:#0b1722; --panel:#12222e; --panel2:#182c3a; --line:#27404f;
  --text:#e9eff3; --muted:#93a7b4;
  --you:#ff7a59; --claude:#4fd1c5; --wait:#e2b24c; --gold:#f2c14e; --done:#7bd389;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45;
  margin:0;padding:0;overflow:hidden}
/* one screen: a slim bar, then the map fills everything; text opens over the whole map */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));flex:none}
h1{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;margin:0;letter-spacing:.5px}
h1 small{display:none}
.frames{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.frames{margin-left:auto}
.frames button{font:500 12px var(--body);color:var(--muted);background:none;border:0;border-radius:6px;padding:4px 8px;cursor:pointer}
.frames button[aria-pressed="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
button:focus-visible,.move:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;gap:2px 16px;min-width:0}
.stat{min-width:0;display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.stat b{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.hot b{color:var(--you)}
.note{font-size:12px;color:var(--ink);background:var(--gold);border-radius:6px;padding:6px 10px;font-weight:500}
main{flex:1;min-height:0;position:relative}
.stage{position:absolute;inset:0;border-top:1px solid var(--line);overflow:hidden;background:#0d3049;min-width:0}
canvas:focus{outline:none}
canvas{display:block;image-rendering:pixelated;cursor:pointer;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,0);font:500 10px var(--body);white-space:nowrap;color:var(--text);
  background:rgba(8,18,26,.78);padding:1px 5px;border-radius:3px}
.lab.storm{background:#1b2030;color:#ffd9cf;box-shadow:0 0 0 1px var(--you)}
.lab.ship{color:var(--done)}
.lab.fog{color:var(--muted);font-style:italic}
.lab.u1::before{background:#f59a2f!important}.lab.u2::before{background:#d9cfae!important}.lab.u0::before{background:#ff4332!important}
.lab.you::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--you);margin-right:4px}
.stagebar{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:8px;display:flex;gap:6px}
.dlg{position:absolute;left:8px;right:8px;bottom:64px;z-index:3;background:#0a141e;border:2px solid var(--text);border-radius:6px;box-shadow:0 0 0 2px var(--ink),0 8px 24px rgba(0,0,0,.5);padding:10px 12px;display:flex;flex-direction:column;gap:5px;max-width:560px;margin:0 auto}
.dlg.guide{border-color:var(--gold)}
.dlg .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}
.dl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding-right:26px}
.dl-top b{font-family:var(--display);font-size:17px;font-weight:700}.dl-top b .mk{margin:0 0 0 6px}
.dl-what{color:var(--muted);font-size:12.5px}
.dl-val{font:500 13px var(--mono)}.dl-val span{color:var(--muted);font-size:11px}
.dl-q{font-weight:600;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.dl-next,.dl-say{font-size:13px;color:var(--text)}.dl-next{color:var(--muted)}
.dlg .facts{font-size:12.5px}
.pie{display:flex;gap:12px;align-items:center}.pie svg{width:96px;height:96px;flex:none}
.pie ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px;min-width:0;flex:1}
.pie li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:0 6px;align-items:baseline}
.pie i{width:10px;height:10px;border-radius:2px}.pie b{font:500 12px var(--mono)}
.pie em{grid-column:2/4;font:normal 11px var(--mono);color:var(--muted)}
.dl-hint{font-size:12.5px;border-left:3px solid var(--gold);padding-left:8px;margin-top:4px}
.dlg .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.st{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:3px;padding:1px 6px;background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.st-fog{background:#56606a}.st-mapped{background:#3f8350}.st-decided,.st-guide{background:var(--gold);color:#2a1e02}.st-done{background:var(--done);color:#062a10}
.dlg:not([hidden])~.dpad{display:none}
.stagebar button,.dpad button{font:500 11px var(--body);color:var(--text);background:rgba(8,18,26,.82);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer}
.dpad{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(2,34px);gap:3px}
.dpad button{padding:0;font-size:14px}
.dpad .u{grid-column:2}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);padding:8px 2px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
/* a page is a big window floating over the map: the map stays visible, dimmed, around its edges, and a click there goes back */
aside{position:absolute;inset:max(10px,2.5%);z-index:6;overflow:auto;background:rgba(18,34,46,.97);display:flex;flex-direction:column;align-items:center;
  border:2px solid var(--text);border-radius:8px;box-shadow:0 0 0 2px var(--ink),0 14px 44px rgba(0,0,0,.65)}
#veil{position:absolute;inset:0;z-index:5;background:rgba(4,10,18,.5);cursor:pointer}
@media (max-width:560px){aside{inset:6px}}
aside[hidden]{display:none}
aside>*{width:100%;max-width:760px}
aside:focus{outline:none}
aside .bar{position:sticky;top:0;z-index:2;max-width:none;display:flex;justify-content:flex-end;padding:8px 14px;background:#12222e;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
aside .x{font:600 12px var(--body);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
#kbd{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:4;font:500 12px var(--body);background:rgba(8,18,26,.9);color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:5px 10px;pointer-events:none}
#compass{position:absolute;z-index:3;max-width:min(260px,48%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 12px var(--body);background:#1a1410;color:#f2c14e;border:1px solid #f2c14e;border-radius:5px;padding:4px 8px;cursor:pointer}
#open{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;font:600 13px var(--body);background:var(--gold);color:#2a1e02;border:2px solid #2a1e02;border-radius:6px;padding:8px 14px;cursor:pointer;max-width:calc(100% - 140px)}
#next{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab[data-p]{pointer-events:auto;cursor:pointer}
.move{display:grid!important;grid-template-columns:12px minmax(0,1fr);gap:0 8px}.move i{margin-top:2px;grid-row:1/4}.move i .mk{margin:0}.move>div{grid-column:2}
.clock.late{color:#ff8a7a}
.mk{display:inline-block;width:8px;height:14px;vertical-align:-2px;margin-right:5px;image-rendering:pixelated}.mk.plus{width:10px;height:10px;vertical-align:0}
h3 .mk{width:10px;height:18px;margin:0 0 0 8px;vertical-align:-1px}h3 .mk.plus{width:13px;height:13px;vertical-align:1px}
.chg{border:1px solid var(--gold);border-radius:6px;padding:8px 10px;background:rgba(242,193,78,.07)}.chg .kind{color:var(--gold)}
.cap{font-size:11.5px;color:var(--muted);margin-top:6px}
.fly{position:sticky;bottom:6px;height:44px;pointer-events:none;overflow:hidden;max-width:none!important}
.fly svg{position:absolute;left:0;bottom:4px;width:66px;height:36px;image-rendering:pixelated;animation:fly 26s linear infinite}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(100vw)}}
@media (prefers-reduced-motion:reduce){.fly svg{animation:none;left:auto;right:16px}}
#chg b{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:8px;background:var(--gold);color:#2a1e02;font:600 10.5px/16px var(--body);text-align:center}
.ranges{display:flex;flex-wrap:wrap;gap:6px}.ranges button[aria-pressed="true"]{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--gold)}
.sum{font-size:13.5px}.sum b{color:var(--gold);font-weight:600}
.day{font:600 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.cm{border-left:2px solid var(--line);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:3px}
.cm .why{font-size:11.5px;color:var(--muted)}
.ev{display:flex;gap:8px;align-items:baseline;text-align:left;width:100%;background:none;border:0;color:var(--text);font:13px var(--body);padding:3px 0;cursor:default}
.ev[data-p]{cursor:pointer}.ev[data-p]:hover span:last-child{text-decoration:underline}
.ev .chip{flex:none;min-width:96px;text-align:center}.ev.work{color:var(--muted)}
.chip.k-decided,.chip.k-record{background:var(--gold);color:#2a1e02}.chip.k-done,.chip.k-place{background:var(--done);color:#062a10}
.chip.k-off{background:var(--claude);color:#04302c}.chip.k-yours{background:var(--you);color:#2b0d04}.chip.k-fact{background:#7fb2e5;color:#0b2238}
.chip.k-new,.chip.k-reopened,.chip.k-placedown,.chip.k-work{background:var(--panel);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
#moves{background:var(--gold);color:#2a1e02;border-color:var(--gold);font-weight:600}
.stagebar{flex-wrap:wrap;right:max(8px,env(safe-area-inset-right,0px))}
aside h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0;padding:12px 14px 2px}
aside .sub{color:var(--muted);font-size:12px;padding:0 14px 10px;border-bottom:1px solid var(--line)}
.move{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;padding:10px 14px;cursor:pointer}
.move:hover{background:var(--panel2)}
.move .t{font-weight:600}
.move .n{color:var(--muted);font-size:12.5px;margin-top:2px}
.clock{font:500 11px var(--mono);color:var(--gold)}
.chip{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;border-radius:3px;padding:1px 6px;margin-right:6px}
.chip.you{background:var(--you);color:#2b0d04}.chip.claude{background:var(--claude);color:#04302c}.chip.wait{background:var(--wait);color:#2e2204}.chip.done{background:var(--done);color:#062a10}
.card{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card .kind{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card h3{font-family:var(--display);font-weight:700;font-size:21px;margin:0;line-height:1.1}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12.5px}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.q{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--panel2)}
.q .t{font-weight:600;margin:4px 0 2px}
.q .n{font-size:12.5px;color:var(--muted)}
.q .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.act{font:600 12px var(--body);border:0;border-radius:5px;padding:6px 10px;cursor:pointer;background:var(--gold);color:#2a1e02}
.act.ghost{background:none;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.copied{font-size:11.5px;color:var(--done)}
#ask{display:none}#ask.on{display:inline-block}
.askbox{display:flex;flex-direction:column;gap:8px}
.askbox textarea{width:100%;min-height:64px;resize:vertical;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:6px;font:14px var(--body);padding:8px}
.turn{border-radius:6px;padding:9px 11px;line-height:1.5;font-size:14px}
.turn.you{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.turn.cl{background:var(--panel2);border:1px solid var(--line)}
.turn.cl p{margin:0 0 8px}.turn.cl p:last-child{margin:0}.turn.cl ul{margin:0 0 8px;padding-left:20px}
.turn .who{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
/* a place's finished state: one row per thing it will hold, each In place, Decided or Open */
.learn{border-left:3px solid var(--gold);padding:2px 0 2px 12px;line-height:1.55;font-size:14px}.learn p{margin:0 0 6px}.learn p:last-child{margin:0}
.sheet{border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.sheet .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--line)}
.sheet .hd b{font:600 13px var(--body)}.sheet .hd span{color:var(--muted);font-size:12px}
.srow{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 11px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.sheet .hd+.srow{border-top:0}.srow .k{font-weight:600}.srow.sr-open .v{color:var(--muted)}
.srow .n{color:var(--muted);font-size:12.5px;margin-top:3px}
.srow details{margin-top:4px;font-size:12.5px;color:var(--muted)}.srow summary{cursor:pointer;color:var(--text)}
.pill{align-self:start;justify-self:start;font:600 11px var(--body);border-radius:10px;padding:2px 8px;white-space:nowrap}
.pill.inplace{background:#2f6b45;color:#e6f6ea}.pill.decided{background:#6b5520;color:#fbefcf}.pill.open{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.qn{color:var(--muted);font-weight:400;font-size:12px}
h4.sec{margin:6px 0 0;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.srow{grid-template-columns:1fr;gap:4px}}
textarea.fallback{width:100%;margin-top:6px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:5px;font:12px var(--mono);padding:6px}
.quiz button{display:block;width:100%;text-align:left;margin-top:5px;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:6px 8px;font:13px var(--body);cursor:pointer}
.quiz button.right{border-color:var(--done);color:var(--done)}.quiz button.wrong{border-color:var(--you);color:var(--you)}
.back{align-self:flex-start}
@media (max-width:1100px){.hud{order:3;width:100%;gap:2px 12px}}
@media (max-width:860px){#next{display:none}}
@media (max-height:420px){.hud{display:none}}
@media (max-height:520px){.dlg{bottom:auto;top:52px}}
@media (max-width:560px){.stat:nth-child(n+3){display:none}}
@media (pointer:coarse){.stagebar button{min-height:40px;min-width:40px;padding:8px 12px;font-size:13px}.frames button{padding:9px 10px}
  .dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:4px}.dpad button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .act,.dlg .x,aside .x{min-height:40px}button{touch-action:manipulation}
  #open{left:8px;right:auto;transform:none;max-width:calc(100% - 180px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px}}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}
</style>

<div class="app">
  <header>
    <h1>__TITLE__<small>__SUBTITLE__</small></h1>
    <div class="hud" id="hud"></div>
    <div class="frames" role="group" aria-label="Preview a point in time">
      <button id="f-today" aria-pressed="true">Today</button>
      <button id="f-sprint" aria-pressed="false">All decided</button>
      <button id="f-end" aria-pressed="false">All done</button>

  </header>
  <div class="note" id="note" hidden></div>

    <div>

</div>

const rnd=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};

const LOCALE=F.locale||'en-US';

const groundOf=(l,y)=>GROUND[l.south&&y>=l.south.from?l.south.ground:l.ground]||GRASS;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const j=(noise(x,y,3)-.5)*.34; let v=SEA;
  WORLD.lands.forEach((l,i)=>{ if(l.shapes.some(([cx,cy,rx,ry,r])=>ell(x,y,cx,cy,rx,ry)+j*(r??1)<1)) v=groundOf(l,y);
    /* places marked g pull their first land's ground out to them */
    if(i===0&&P.some(p=>p.g&&ell(x,y,p.x,p.y+.3,2.4,2.1)+j*.6<1)) v=groundOf(l,y); });
  set(x,y,v);
}

/* which land a tile belongs to: the nearest land you can reach, by its shapes; its ground sets the dry palette */
const LANDI=[];const landAt=(x,y)=>{const k=y*W+x; if(LANDI[k]!==undefined)return LANDI[k]; let best=null,bd=1e9;
  WORLD.lands.forEach(l=>{ if(l.reach===false)return; l.shapes.forEach(([cx,cy,rx,ry])=>{const d=ell(x,y,cx,cy,rx,ry); if(d<bd){bd=d;best=l}})}); return LANDI[k]=best};
const dryAt=(x,y)=>{const l=landAt(x,y); return !!l&&groundOf(l,y)!==GRASS};
const pinesAt=(x,y)=>{const p=landAt(x,y)?.pines; return !!p&&x>=p[0]&&y>=p[1]&&x<p[2]&&y<p[3]};

const nearPlace=(x,y,r)=>P.some(p=>Math.abs(p.x-x)<=r&&Math.abs(p.y-y)<=r);

function toMap(){const a=document.activeElement;if(a&&a!==document.body&&a.id!=='cv')a.blur();try{window.focus();$('#cv').focus({preventScroll:true})}catch(e){}}
const turnOf=q=>frame==='today'?q.turn:(frame==='sprint'&&q.turn!=='done'?(q.turn==='you'?'claude':'wait'):'done');
/* the one ranking of your moves, used by Your moves, the Next button and the compass:
   overdue first, then the nearest hard deadline (tier), then the earlier date, then the quest that unblocks the most others */
const unblocks=q=>allQ().filter(o=>o.state==='open'&&(o.blk||[]).includes(q.n)).length;
const myMoves=()=>allQ().filter(q=>turnOf(q)==='you').map(q=>({...q,ub:unblocks(q)})).sort((a,b)=>(b.late|0)-(a.late|0)||a.tier-b.tier||(a.due||'9999').localeCompare(b.due||'9999')||b.ub-a.ub||a.n-b.n);

const visited=new Set();
const compassQ=()=>frame==='today'?myMoves().find(q=>!visited.has(q.p.id))||null:null;

 wide:[`More controls: <b>− +</b> and <b>Whole map</b> at the top left, or scroll, pinch and drag the map. A <b>storm</b> at sea is a hard deadline: ${TAP} it to see what is due by then. The <b>blimp</b> shows your net worth. <b>All decided</b> and <b>All done</b> above the map preview where this is heading.`,false]};
let pending=null;
function tip(k){ if(tipsOff)return;
  if(k==='place'||k==='fog'){placesSeen++; if(seen[k]){ if(placesSeen>=3&&!seen.wide){k='wide'} else return } else {pending=k; return void setTimeout(()=>{ if(pending===k&&!seen[k]&&!tipsOff&&sel&&!hero.path.length&&$('#side').hidden){seen[k]=1;save();say('guide',TIPS[k][0])}},1200)} }
  if(k==='walked')return;
  if(seen[k])return; seen[k]=1;save(); say('guide',TIPS[k][0],TIPS[k][1])}
function tipNext(){seen.start2=1;save();say('guide',TIPS.start2[0])}

/* ---------- input ---------- */
const placeAt=(tx,ty)=>P.find(p=>Math.abs(p.x-tx)<=1&&ty>=p.y-(urg(p)>=0?2:1)&&ty<=p.y+1);
function mapClick(tx,ty){
  /* places first, so a storm cloud or the blimp drifting over a place never steals its click */
  const p=placeAt(tx,ty);
  if(p){goTo(p);return} /* a place you clicked opens when you get there */
  if(frame==='today'){const st=STORMS.find(st=>{const s=stormPos(st);return tx>=s.x-2&&tx<=s.x+3&&ty>=s.y-1&&ty<=s.y+3});if(st){stormView(st);return}}
  const bl=blimp(); if(Math.abs(bl.x+.5-tx)<=2.5&&Math.abs(bl.y-ty)<=2){blimpView();return}
  let best=null,bd=9;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const d=Math.abs(dx)+Math.abs(dy);if(d<bd&&walk(tx+dx,ty+dy)){bd=d;best=[tx+dx,ty+dy]}}
  if(best){const [hx,hy]=here();const path=bfs(hx,hy,best[0],best[1]);if(path){hero.path=path;hero.auto=false;sel=null;$('#dlg').hidden=true;labels()}}}
cv.addEventListener('click',e=>{if(dragged){dragged=false;return}const r=cv.getBoundingClientRect();mapClick(Math.floor(cam.x+(e.clientX-r.left)/r.width*cam.w),Math.floor(cam.y+(e.clientY-r.top)/r.height*cam.h))});
/* a label takes a click only where no building is under it */
$('#labels').addEventListener('click',e=>{const l=e.target.closest('[data-p]');if(!l)return;const r=cv.getBoundingClientRect(),tx=Math.floor(cam.x+(e.clientX-r.left)/r.width*cam.w),ty=Math.floor(cam.y+(e.clientY-r.top)/r.height*cam.h);goTo(placeAt(tx,ty)||byId[l.dataset.p])});
addEventListener('keydown',e=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if((e.key==='Enter'||e.key===' ')&&document.activeElement.tagName!=='BUTTON'&&$('#side').hidden){
    if(!$('#dlg').hidden){e.preventDefault();$('#dlg .act').click();return}
    const p=near();if(p&&!hero.path.length){e.preventDefault();select(p)}return}
  if(!$('#side').hidden)return;
  if(e.key==='+'||e.key==='='){zoomBy(1);return} if(e.key==='-'){zoomBy(-1);return}
  if(!k||!$('#side').hidden)return; e.preventDefault(); step(k[0],k[1])});
/* d-pad: one step per press, and it keeps walking while held */
document.querySelectorAll('.dpad button').forEach(b=>{const [x,y]=b.dataset.d.split(',').map(Number);let t=0;const stop=()=>{clearInterval(t);t=0};
  b.addEventListener('pointerdown',e=>{e.preventDefault();step(x,y);stop();t=setInterval(()=>{if(!hero.path.length&&walk(hero.x+x,hero.y+y))step(x,y)},60)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('click',e=>{if(e.detail===0)step(x,y)})});
$('#zoom').addEventListener('click',()=>{pan={x:0,y:0};setZoom(whole?(lastZi>0?lastZi:1):0);draw();labels()});
$('#zin').addEventListener('click',()=>zoomBy(1));$('#zout').addEventListener('click',()=>zoomBy(-1));
/* wheel and pinch zoom, drag to look around */
let dragged=false,wheelAcc=0,wheelAt=0;let pinch0=0;
/* one zoom step per wheel notch, and at most four a second, so a trackpad swipe does not run through every level */
cv.addEventListener('wheel',e=>{e.preventDefault();wheelAcc+=e.deltaY;const now=performance.now();if(Math.abs(wheelAcc)>=(e.ctrlKey?14:100)&&now-wheelAt>240){const r=cv.getBoundingClientRect(),ax=(e.clientX-r.left)/r.width,ay=(e.clientY-r.top)/r.height,tx=cam.x+ax*cam.w,ty=cam.y+ay*cam.h;zoomBy(wheelAcc<0?1:-1);pan.x+=tx-(cam.x+ax*cam.w);pan.y+=ty-(cam.y+ay*cam.h);draw();labels();wheelAcc=0;wheelAt=now}else if(now-wheelAt<=240&&Math.abs(wheelAcc)>300)wheelAcc=0},{passive:false});
const spread=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});if(pts.size===2)pinch0=spread();dragged=false});
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pts.size===2){const d=spread();dragged=true;if(d>pinch0*1.3){zoomBy(1);pinch0=d}else if(d<pinch0/1.3){zoomBy(-1);pinch0=d}return}
  if(!dragged&&Math.hypot(e.clientX-p.x0,e.clientY-p.y0)<7)return;
  if(!dragged){dragged=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  pan.x-=dx/(z*T);pan.y-=dy/(z*T);draw();labels()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{pts.delete(e.pointerId)}));
$('#open').addEventListener('click',()=>{const p=near();if(p)select(p)});$('#blimp').addEventListener('click',blimpView);$('#moves').addEventListener('click',()=>{listView();openSide()});

$('.stagebar').addEventListener('click',()=>setTimeout(()=>{if($('#side').hidden)toMap()},0));
[['today','#f-today'],['sprint','#f-sprint'],['end','#f-end']].forEach(([f,id])=>$(id).addEventListener('click',()=>{frame=f;document.querySelectorAll('.frames button').forEach(b=>b.setAttribute('aria-pressed',b.id===id.slice(1)));hud();if(!$('#side').hidden&&sel)cardView(sel);else if(!$('#side').hidden)listView();layout();draw();labels()}));

  if(e.key==='Escape'||(e.key==='Backspace'&&!typing)){ if($('#side').hidden&&$('#dlg').hidden){if(e.key==='Escape'&&hero.path.length>1){hero.auto=false;hero.path.length=1}return} e.preventDefault();e.stopImmediatePropagation();$('#dlg').hidden=true;closeSide()}},true);

addEventListener('blur',()=>setTimeout(()=>{try{window.focus()}catch(e){} if(!document.hasFocus()&&matchMedia('(hover:hover) and (pointer:fine)').matches)$('#kbd').hidden=false},60));
addEventListener('focus',()=>{$('#kbd').hidden=true});
$('#stage').addEventListener('pointerenter',()=>{if($('#side').hidden)toMap()});$('#dlg').addEventListener('click',()=>setTimeout(()=>{if($('#dlg').hidden)toMap()},0));
addEventListener('resize',()=>{layout();draw();labels()});
(function dprWatch(){matchMedia(`(resolution:${window.devicePixelRatio||1}dppx)`).addEventListener('change',()=>{layout();draw();labels();dprWatch()},{once:true})})();
/* the map box can change size without the window changing (the preview bar, the header wrapping) */
if(window.ResizeObserver){let sw=0,sh=0;new ResizeObserver(()=>{const st=$('#stage');if(st.clientWidth!==sw||st.clientHeight!==sh){sw=st.clientWidth;sh=st.clientHeight;layout();draw();labels()}}).observe($('#stage'))}

function welcome(){const ev=unseen();if(!ev.length||!seen.start||!$('#dlg').hidden)return;
  const cs=inRange('new'),top=ORDER.filter(k=>ev.some(e=>e.k===k)).slice(0,3).map(k=>{const n=ev.filter(e=>e.k===k).length;return `<b>${n}</b> ${n===1?KIND[k][1]:KIND[k][2]}`});
  say('guide',`Welcome back. ${seenAt?'Since your last look':'This week'}: ${top.join(', ')}. A gold <b>+</b> marks each place that changed.`);
  $('#dlg .row').innerHTML='<button class="act" data-show="1">See what changed</button><button class="act ghost" data-close="1">Later</button>'}
function start(){hud();chgBadge();layout();listView();draw();labels();requestAnimationFrame(loop);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(labels);tip('start');welcome()}
/* Ask Claude: the page asks Claude directly, on your own Claude account, with the whole map as context.
   Claude here can explain and suggest. It changes nothing: the map changes only in the agent's own thread. */
let sampleFn=null, chat=[], askCtl=null, askFocus=null;
const MAPRULES=`How the map works. Places are parts of the family's finances; quests are tickets in the Finance repo.
A place's status: In fog (not known or not decided), Sighted (known, no current document confirms it), Mapped (a statement backs the number), Decided (every quest there has a dated decision written down), Done (in place and running by itself, automation included). A place is only as far along as its least advanced quest, and a quest counts as decided only when its whole Answer is written with a date, so partial progress inside one quest does not show.
Colour on a place shows urgency of ${F.player}'s own moves there: red = the nearest hard deadline (tier 0), orange = next (tier 1), pale = later. A gold + means something changed since ${F.player} last looked.
A storm sits near a place while any quest due by the storm's date is still open (not decided). It clears when every such quest is decided or done.
Turn: "you" = ${F.player}'s move; "claude" = Claude's move (the ${F.agent} agent); "wait" = waiting on someone named in "who"; "done".
Quests marked decided are no longer open, even if the real-world action happens later.`;
function mapData(){return JSON.stringify({today:new Date().toISOString().slice(0,10),storms:STORMS.map(s=>({at:s.at,what:s.what,date:s.date})),
  places:P.map(p=>({id:p.id,name:p.name,land:p.land,what:p.what,status:statusOf(p),value:p.val,source:p.src,
    quests:p.q.map(q=>({n:q.n,title:q.t,state:q.state,turn:q.turn,who:q.who||undefined,tier:q.tier,next:q.next,clock:q.due||'none',blockedBy:q.blk&&q.blk.length?q.blk:undefined}))}))})}
function askRules(p){return `You are Claude, the ${F.agent} agent for ${F.name}, answering ${F.player} inside "${F.title}", a game map of the family's finances that is built from the ${F.agent} repo's tickets.
${MAPRULES}
Answer ${F.player}'s question about the map. Rules: plain, warm, short (under 180 words unless asked for more); speak to ${F.player} as "you"; name quests by number and title; say concretely what would change the map and who does it. Use only the data below; if it cannot answer, say what you would need. You cannot change anything from here: to act, ${F.player} pastes your answer or the ask into ${F.thread}. Never invent amounts or dates. Use simple Markdown only: short paragraphs, "- " bullets, **bold**.
${p?`${F.player} is looking at the place "${p.name}" (id ${p.id}).
`:''}The map right now (JSON):
${mapData()}`}
function md(t){const e=esc(t).replace(/\*\*(.+?)\*\*/g,(m,b)=>'<b>'+b+'</b>');const out=[];let ul=null;
  e.split('\n').forEach(l=>{const m=l.match(/^\s*[-*•] (.*)/);if(m){if(!ul){ul=[];out.push(ul)}ul.push(m[1])}else{ul=null;if(l.trim())out.push(l)}});
  return out.map(x=>Array.isArray(x)?`<ul>${x.map(i=>`<li>${i}</li>`).join('')}</ul>`:`<p>${x}</p>`).join('')}
const ASKERR={rate_limited:'Claude is busy or you have hit a usage limit. Try again in a little while.',session_expired:'Sign in to Claude again, then ask.',refused:'Claude would not answer that one. Try asking it another way.',empty_completion:'No answer came back. Try a shorter question.'};
function askView(p){askFocus=p||null;
  const sug=p?[`Why is ${p.name} still ${ST[statusOf(p)].toLowerCase()}? What would move it forward?`,`What is my next move at ${p.name}?`]:(WORLD.ask?.suggest||['What are my three most important moves this week?']);
  let h=`${XBTN}<div class="card"><div><h3>Ask Claude</h3><div style="color:var(--muted)">Claude sees the whole map as it is now: every place, quest and deadline${p?`, and that you are at ${esc(p.name)}`:''}. It explains and suggests. It changes nothing; changes happen in ${esc(F.thread)}. It uses your own Claude account.</div></div>`;
  h+=`<div class="askbox" id="turns">${chat.map(t=>`<div class="turn ${t.role==='user'?'you':'cl'}"><div class="who">${t.role==='user'?'You':'Claude'}</div>${t.role==='user'?esc(t.content):md(t.content)}</div>`).join('')}</div>`;
  h+=`<div class="askbox"><textarea id="askq" placeholder="Ask about any place, quest or deadline" aria-label="Your question"></textarea>
   <div class="row"><button class="act" id="asksend">Ask</button><button class="act ghost" id="askstop" hidden>Stop</button>${chat.length?'<button class="act ghost" id="asknew">New conversation</button>':''}</div>
   ${chat.length?'':`<div class="row">${sug.map(q=>`<button class="act ghost" data-sug="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}<div class="n" id="asknote"></div></div></div>`;
  $('#side').innerHTML=h;openSide();const ta=$('#askq');
  ta.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}if(e.key==='Escape'){e.preventDefault();closeSide()}});
  $('#asksend').onclick=()=>ask();$('#askstop').onclick=()=>askCtl&&askCtl.abort();
  if($('#asknew'))$('#asknew').onclick=()=>{chat=[];askView(askFocus)};
  document.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{ta.value=b.dataset.sug;ask()});
  setTimeout(()=>{try{ta.focus()}catch(e){}},0)}
async function ask(){const ta=$('#askq'),q=ta&&ta.value.trim();if(!q||!sampleFn||askCtl)return;
  chat.push({role:'user',content:q});ta.value='';
  const turns=$('#turns'),you=document.createElement('div');you.className='turn you';you.innerHTML=`<div class="who">You</div>${esc(q)}`;turns.append(you);
  const box=document.createElement('div');box.className='turn cl';box.innerHTML='<div class="who">Claude</div><p>Thinking…</p>';turns.append(box);
  document.querySelectorAll('[data-sug]').forEach(b=>b.parentElement.remove());
  box.scrollIntoView({block:'nearest'});askCtl=new AbortController();$('#asksend').disabled=true;$('#askstop').hidden=false;$('#asknote').textContent='';
  const keep=chat.slice(-12);
  try{const r=await sampleFn([{role:'user',content:askRules(askFocus)},{role:'assistant',content:'Understood. What would you like to know?'},...keep],
      {cache:false,signal:askCtl.signal,onText:({text})=>{box.innerHTML='<div class="who">Claude</div>'+md(text)}});
    chat.push({role:'assistant',content:r.text});if(r.truncated)$('#asknote').textContent='The answer was cut short. Ask for less at a time.'}
  catch(e){const code=e&&e.code;
    if(e&&e.text){box.innerHTML='<div class="who">Claude</div>'+md(e.text);chat.push({role:'assistant',content:e.text})}else{box.remove();chat.pop()}
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){$('#ask').classList.remove('on');$('#asknote').textContent='Asking Claude is switched off for this page.'}
    else if(code!=='cancelled')$('#asknote').textContent=ASKERR[code]||'Something went wrong on the way to Claude. Try again.'}
  finally{askCtl=null;if($('#asksend')){$('#asksend').disabled=false;$('#askstop').hidden=true}}}
$('#ask').addEventListener('click',()=>askView(sel&&!$('#side').hidden?sel:null));
(async()=>{try{if(window.claude&&claude.use){sampleFn=await claude.use('sample');if(sampleFn)$('#ask').classList.add('on')}}catch(e){}})();
window.twoShores={P,byId,walk,bfs,goTo,view:()=>({x:cam.x,y:cam.y,z,sel:sel&&sel.id})}; /* a handle for tests */
start();
})();
